<div class="container-fluid vh-100 d-flex align-items-center justify-content-center">
  <div class="row w-80 shadow-lg rounded overflow-hidden">
    <!-- Columna Izquierda: Video -->
    <div class="col-md-6 video-container position-relative">
      <video autoplay loop muted class="video-bg w-100 h-100 object-fit-cover">
        <source src="assets/videos/forgot-password-two.mp4" type="video/mp4">
        Tu navegador no soporta videos.
      </video>
    </div>

    <!-- Columna Derecha: Formulario -->
    <div class="col-md-6 p-5 bg-white">
      <h2 class="text-center mb-4 text-dark">Recuperar Contraseña</h2>
      <p class="text-muted text-center">Ingrese su correo electrónico y le enviaremos instrucciones para restablecer su contraseña.</p>

      <form [formGroup]="fgPassword" (ngSubmit)="submitRequest()">
        <!-- Campo de Email -->
        <div class="mb-3">
          <label for="email" class="form-label fw-bold">Correo Electrónico</label>
          <input
            type="email"
            id="email"
            class="form-control form-control-md"
            formControlName="email"
            placeholder="Ingrese su correo electrónico"
          />
          <div *ngIf="fgPassword.get('email')?.invalid && fgPassword.get('email')?.touched">
            <small class="text-danger" *ngIf="fgPassword.get('email')?.hasError('required')">Este campo es obligatorio.</small>
            <small class="text-danger" *ngIf="fgPassword.get('email')?.hasError('email')">Ingrese un correo válido.</small>
          </div>
        </div>

        <!-- Botón de Enviar -->
        <div class="d-grid">
          <button type="submit" class="btn btn-dark btn-md" [disabled]="fgPassword.invalid">
            Enviar instrucciones
          </button>
        </div>

        <!-- Mensaje de Éxito -->
        <div *ngIf="successMessage" class="alert alert-success mt-3">
          {{ successMessage }}
        </div>

        <!-- Mensaje de Error -->
        <div *ngIf="errorMessage" class="alert alert-danger mt-3">
          {{ errorMessage }}
        </div>
      </form>

      <!-- Botón para Volver al Inicio de Sesión -->
      <div class="text-center mt-3">
        <button class="btn btn-outline-secondary btn-sm" (click)="redirectToLogin()">
          Volver al inicio de sesión
        </button>
      </div>
    </div>
  </div>
</div>
