<app-navbar></app-navbar>

<div class="container mt-4">
  <h2 class="text-center mb-4">Gestión de Clientes</h2>

  <!-- Formulario para agregar/editar cliente -->
  <div class="card p-4 mb-4">
    <h4 *ngIf="!selectedClient">Agregar Nuevo Cliente</h4>
    <h4 *ngIf="selectedClient">Editar Cliente</h4>

    <form [formGroup]="clientForm" (ngSubmit)="selectedClient ? updateUser() : addUser()">
      <!-- Sección de información básica -->
      <div class="row mb-3">
        <div class="col-md-4">
          <label for="name" class="form-label">Nombre</label>
          <input id="name" type="text" class="form-control" formControlName="name">
        </div>
        <div class="col-md-4">
          <label for="first_surname" class="form-label">Apellido Paterno</label>
          <input id="first_surname" type="text" class="form-control" formControlName="first_surname">
        </div>
        <div class="col-md-4">
          <label for="last_surname" class="form-label">Apellido Materno</label>
          <input id="last_surname" type="text" class="form-control" formControlName="last_surname">
        </div>
      </div>

      <!-- Sección de información de contacto -->
      <div class="row mb-3">
        <div class="col-md-4">
          <label for="phone_number" class="form-label">Teléfono</label>
          <input id="phone_number" type="text" class="form-control" formControlName="phone_number">
        </div>
        <div class="col-md-4">
          <label for="email" class="form-label">Correo Electrónico</label>
          <input id="email" type="email" class="form-control" formControlName="email">
        </div>
        <div class="col-md-4">
          <label for="username" class="form-label">Usuario</label>
          <input id="username" type="text" class="form-control" formControlName="username">
        </div>
      </div>

      <!-- Sección de contraseña -->
      <div class="row mb-3">
        <div class="col-md-6">
          <label for="password" class="form-label">Contraseña</label>
          <input id="password" type="password" class="form-control" formControlName="password">
        </div>
      </div>

      <!-- Sección de información adicional del cliente -->
      <div class="row mb-3">
        <div class="col-md-4">
          <label for="city" class="form-label">Ciudad</label>
          <input id="city" type="text" class="form-control" formControlName="city">
        </div>
        <div class="col-md-4">
          <label for="postal_code" class="form-label">Código Postal</label>
          <input id="postal_code" type="text" class="form-control" formControlName="postal_code">
        </div>
        <div class="col-md-4">
          <label for="date_of_birth" class="form-label">Fecha de Nacimiento</label>
          <input id="date_of_birth" type="date" class="form-control" formControlName="date_of_birth">
        </div>
      </div>

      <!-- Botones de acción -->
      <div class="mt-3 d-flex justify-content-between">
        <button type="submit" class="btn btn-success">
          {{ selectedClient ? 'Actualizar' : 'Agregar' }} Cliente
        </button>
        <button *ngIf="selectedClient" type="button" class="btn btn-secondary" (click)="selectedClient = null; clientForm.reset()">
          Cancelar
        </button>
      </div>
    </form>
  </div>

  <!-- Menú adicional -->
  <div class="mt-2">
    <app-menu></app-menu>
  </div>

  <!-- Tabla de Clientes -->
  <app-client-table
    [users]="clients"
    (editUserEvent)="editUser($event)"
    (deleteUserEvent)="confirmDelete($event)">
  </app-client-table>

  <!-- Modal para eliminación de cliente -->
  <div class="modal fade" id="deleteUserModal" tabindex="-1" aria-labelledby="deleteUserModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="deleteUserModalLabel">Eliminar Cliente</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          ¿Estás seguro de que deseas eliminar este cliente? Esta acción no se puede deshacer.
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
            Cancelar
          </button>
          <button type="button" class="btn btn-danger" (click)="deleteUser()">
            Eliminar
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<app-footer></app-footer>
