<app-navbar></app-navbar>

<div class="container mt-4">
  <h2 class="text-center mb-4">Gestión de Productos</h2>

  <!-- Formulario para agregar/editar producto -->
  <div class="card p-4 mb-4">
    <h4 *ngIf="!selectedProduct">Agregar Nuevo Producto</h4>
    <h4 *ngIf="selectedProduct">Editar Producto</h4>

    <form [formGroup]="productForm" (ngSubmit)="selectedProduct ? updateProduct() : addProduct()">
      <div class="row">
        <div class="col-md-6">
          <label for="name_product" class="form-label">Nombre del producto</label>
          <input id="name_product" type="text" class="form-control" formControlName="name_product" placeholder="Ingresa el nombre del producto..." required>
        </div>
        <div class="col-md-6">
          <label for="price_product" class="form-label">Precio del producto</label>
          <input id="price_product" type="number" class="form-control" formControlName="price_product" placeholder="Ingresa el precio..." required min="0" step="0.01">
        </div>
      </div>

      <div class="row mt-3">
        <div class="col-md-6">
          <label for="categoryid" class="form-label">Categoría del producto</label>
          <select id="categoryid" class="form-select" formControlName="categoryid" required>
            <option value="" disabled selected>Selecciona una categoría</option>
            <option value="1">Panadería</option>
            <option value="2">Repostería</option>
          </select>
        </div>
        <div class="col-md-6">
          <label for="stock" class="form-label">Stock del producto</label>
          <input id="stock" type="number" class="form-control" formControlName="stock" placeholder="Ingresa el stock..." required min="0">
        </div>
      </div>

      <div class="row mt-3">
        <div class="col-md-6">
          <label for="ingredients" class="form-label">Ingredientes del producto</label>
          <input id="ingredients" type="text" class="form-control" formControlName="ingredients" placeholder="Ingresa los ingredientes..." required>
        </div>
        <div class="col-md-6">
          <label for="baking_time" class="form-label">Tiempo de horneado</label>
          <input id="baking_time" type="text" class="form-control" formControlName="baking_time" placeholder="Ingresa el tiempo de horneado..." required>
        </div>
      </div>

      <div class="row mt-3">
        <div class="col-md-6">
          <label for="image" class="form-label">Imagen del producto</label>
          <input
            type="file"
            class="form-control"
            id="image"
            name="image"
            accept="image/*"
            (change)="onFileChange($event)"
            required
            [ngClass]="{ 'is-invalid': productForm.get('image')?.invalid && productForm.get('image')?.touched }"
          >
          <div class="invalid-feedback" *ngIf="productForm.get('image')?.invalid && productForm.get('image')?.touched">
            <span *ngIf="productForm.get('image')?.errors?.['required']">Por favor, selecciona una imagen.</span>
            <span *ngIf="productForm.get('image')?.errors?.['invalidFileType']">El archivo debe ser una imagen (jpg, png, gif, etc.).</span>
          </div>
        </div>
      </div>

      <div class="mt-3 d-flex justify-content-between">
        <button type="submit" class="btn btn-success">
          {{ selectedProduct ? 'Actualizar' : 'Agregar' }} Producto
        </button>
        <button *ngIf="selectedProduct" type="button" class="btn btn-secondary" (click)="selectedProduct = null; productForm.reset()">
          Cancelar
        </button>
      </div>
    </form>
  </div>

  <div class="mt-2">
    <app-menu></app-menu>
  </div>

  <!-- Tabla de Productos -->
  <app-product-table
    [products]="products"
    (updateProduct)="editProduct($event)"
    (deleteProduct)="confirmDelete($event)">
  </app-product-table>

  <!-- Modal para eliminación de producto -->
  <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="deleteModalLabel">Eliminar Producto</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          ¿Estás seguro de que deseas eliminar este producto? Esta acción no se puede deshacer.
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
            Cancelar
          </button>
          <button type="button" class="btn btn-danger" (click)="deleteProduct()">
            Eliminar
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<app-footer></app-footer>
