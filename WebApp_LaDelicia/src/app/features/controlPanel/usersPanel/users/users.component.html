<app-navbar></app-navbar>

<div class="container mt-4">
  <h2 class="text-center mb-4">Gestión de Usuarios</h2>

  <!-- Formulario para agregar/editar usuario -->
  <div class="card p-4 mb-4">
    <h4 *ngIf="!selectedUser">Agregar Nuevo Usuario</h4>
    <h4 *ngIf="selectedUser">Editar Usuario</h4>

    <!-- Usa la misma lógica: si selectedUser existe => update, sino => addUser -->
    <form [formGroup]="userForm" (ngSubmit)="selectedUser ? updateUser() : addUser()">
      <div class="row">
        <div class="col-md-4">
          <label for="name" class="form-label">Nombre</label>
          <input id="name" type="text" class="form-control" formControlName="name">
        </div>
        <div class="col-md-4">
          <label for="first_surname" class="form-label">Apellido Paterno</label>
          <input id="first_surname" type="text" class="form-control" formControlName="first_surname">
        </div>
        <div class="col-md-4">
          <label for="last_surname" class="form-label">Apellido Materno</label>
          <input id="last_surname" type="text" class="form-control" formControlName="last_surname">
        </div>
      </div>

      <div class="row mt-3">
        <div class="col-md-4">
          <label for="phone_number" class="form-label">Teléfono</label>
          <input id="phone_number" type="text" class="form-control" formControlName="phone_number">
        </div>
        <div class="col-md-4">
          <label for="email" class="form-label">Correo Electrónico</label>
          <input id="email" type="email" class="form-control" formControlName="email">
        </div>
        <div class="col-md-4">
          <label for="username" class="form-label">Usuario</label>
          <input id="username" type="text" class="form-control" formControlName="username">
        </div>
      </div>

      <div class="row mt-3">
        <div class="col-md-6">
          <label for="password" class="form-label">Contraseña</label>
          <input id="password" type="password" class="form-control" formControlName="password">
        </div>
      </div>

      <div class="mt-3 d-flex justify-content-between">
        <button type="submit" class="btn btn-success">
          {{ selectedUser ? 'Actualizar' : 'Agregar' }} Usuario
        </button>
        <button *ngIf="selectedUser" type="button" class="btn btn-secondary" (click)="selectedUser = null; userForm.reset()">
          Cancelar
        </button>
      </div>
    </form>
  </div>

  <div class="mt-2">
    <app-menu></app-menu>
  </div>

  <!-- Tabla de Usuarios -->
  <app-user-table
    [users]="users"
    (editUserEvent)="editUser($event)"
    (deleteUserEvent)="confirmDelete($event)">
  </app-user-table>

  <!-- Modal para eliminación de usuario -->
  <div class="modal fade" id="deleteUserModal" tabindex="-1" aria-labelledby="deleteUserModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="deleteUserModalLabel">Eliminar Usuario</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          ¿Estás seguro de que deseas eliminar este usuario? Esta acción no se puede deshacer.
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
            Cancelar
          </button>
          <button type="button" class="btn btn-danger" (click)="deleteUser()">
            Eliminar
          </button>
        </div>
      </div>
    </div>
  </div>


</div>

<app-footer></app-footer>
