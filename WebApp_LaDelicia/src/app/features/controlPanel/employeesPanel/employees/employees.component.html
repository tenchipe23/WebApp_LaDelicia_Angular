<app-panel-navbar></app-panel-navbar>

<div class="container mt-5 mb-5 p-4 my-3">
  <div class="row">
    <!-- Columna izquierda: Formulario -->
    <div class="col-lg-4 col-md-12">
      <h2>Formulario de empleados</h2>
      <form [formGroup]="employeeForm" (ngSubmit)="saveEmployee()">
        <div class="mb-3">
          <label for="nombre" class="form-label">Nombre</label>
          <input type="text" class="form-control" formControlName="nombre" placeholder="Ingresa el nombre..." />
        </div>
        <div class="mb-3">
          <label for="apellido" class="form-label">Apellido</label>
          <input type="text" class="form-control" formControlName="apellido" placeholder="Ingresa el apellido..." />
        </div>
        <div class="mb-3">
          <label for="calle" class="form-label">Calle</label>
          <input type="text" class="form-control" formControlName="calle" placeholder="Ingresa la calle..." />
        </div>
        <div class="mb-3">
          <label for="ciudad" class="form-label">Ciudad</label>
          <input type="text" class="form-control" formControlName="ciudad" placeholder="Ingresa la ciudad..." />
        </div>
        <div class="mb-3">
          <label for="codigoPostal" class="form-label">Código postal</label>
          <input type="text" class="form-control" formControlName="codigoPostal" placeholder="Ingresa el código postal..." />
        </div>
        <div class="mb-3">
          <label for="telefono" class="form-label">Teléfono</label>
          <input type="text" class="form-control" formControlName="telefono" placeholder="Ingresa el teléfono..." />
        </div>
        <div class="mb-3">
          <label for="salario" class="form-label">Salario</label>
          <input type="number" class="form-control" formControlName="salario" placeholder="Ingresa el salario..." />
        </div>
        <div class="d-grid gap-2">
          <button class="btn btn-success" type="submit">Guardar</button>
          <button class="btn btn-secondary" type="reset">Limpiar</button>
        </div>
      </form>
    </div>

    <!-- Columna derecha: Tabla de empleados -->
    <div class="col-lg-8 col-md-12">
      <h2 class="text-center">Listado de empleados</h2>
      <app-employee-table [employees]="employees"></app-employee-table>
    </div>
  </div>

  <!-- Sección donde se incluye el componente de menú (fuera del formulario) -->
  <div class="mt-3">
    <app-menu></app-menu>
  </div>
</div>

<app-footer></app-footer>
