<app-panel-navbar></app-panel-navbar>
<br> <br> <br> <br>
<div class="container mt-5">
  <h2 class="text-center mb-4 mt-5">Gestión de Empleados</h2>

  <!-- Formulario para agregar/editar empleado -->
  <div class="card p-4 mb-4 mt-5">
    <h4 *ngIf="!selectedEmployee">Agregar Nuevo Empleado</h4>
    <h4 *ngIf="selectedEmployee">Editar Empleado</h4>

    <form [formGroup]="employeeForm" (ngSubmit)="selectedEmployee ? updateEmployee() : addEmployee()">
      <div class="row">
        <div class="col-md-4">
          <label for="name_employee" class="form-label">Nombre</label>
          <input id="name_employee" type="text" class="form-control" formControlName="name_employee">
        </div>
        <div class="col-md-4">
          <label for="middle_name" class="form-label">Primer Apellido</label>
          <input id="middle_name" type="text" class="form-control" formControlName="middle_name">
        </div>
        <div class="col-md-4">
          <label for="last_name" class="form-label">Segundo Apellido</label>
          <input id="last_name" type="text" class="form-control" formControlName="last_name">
        </div>
        <div class="col-md-4">
          <label for="street_address" class="form-label">Calle </label>
          <input id="street_address" type="text" class="form-control" formControlName="street_address">
        </div>
      </div>

      <div class="row mt-3">
        <div class="col-md-4">
          <label for="city_address" class="form-label">Ciudad</label>
          <input id="city_address" type="text" class="form-control" formControlName="city_address">
        </div>
        <div class="col-md-4">
          <label for="postal_code" class="form-label">Código Postal</label>
          <input id="postal_code" type="text" class="form-control" formControlName="postal_code">
        </div>
        <div class="col-md-4">
          <label for="cellphone_number" class="form-label">Teléfono</label>
          <input id="cellphone_number" type="text" class="form-control" formControlName="cellphone_number">
        </div>
      </div>

      <div class="mt-3 d-flex justify-content-between">
        <button type="submit" class="btn btn-success">
          {{ selectedEmployee ? 'Actualizar' : 'Agregar' }} Empleado
        </button>
        <button
          *ngIf="selectedEmployee"
          type="button"
          class="btn btn-secondary"
          (click)="cancelEdit()">
          Cancelar
        </button>
      </div>
    </form>
  </div>

  <div class="mt-2">
    <app-menu></app-menu>
  </div>

  <!-- Tabla de Empleados -->
  <app-employee-table [employees]="employees"
                      (editEmployeeEvent)="editEmployee($event)"
                      (deleteEmployeeEvent)="confirmDelete($event)">
  </app-employee-table>

  <!-- Modal para eliminación de empleado -->
  <div
    class="modal fade"
    id="deleteEmployeeModal"
    tabindex="-1"
    aria-labelledby="deleteEmployeeModalLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Eliminar Empleado</h5>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Close"
          ></button>
        </div>
        <div class="modal-body">
          ¿Estás seguro de que deseas eliminar este empleado? Esta acción no se puede deshacer.
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
            Cancelar
          </button>
          <button
            type="button"
            class="btn btn-danger"
            (click)="deleteEmployee()">
            Eliminar
          </button>
        </div>
      </div>
    </div>
  </div>

</div>

<app-footer></app-footer>
